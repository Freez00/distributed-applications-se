        name:
          type: string
          maxLength: 100
          example: Sofia Airport
        city:
          type: string
          maxLength: 80
          example: Sofia
        country:
          type: string
          maxLength: 80
          example: Bulgaria
        timezone:
          type: string
          maxLength: 50
          example: Europe/Sofia
        isActive:
