    Flight:
      type: object
      description: Отговор за полет. availableSeats се изчислява и не се съхранява в базата данни.
      required:
        - id
        - flightNumber
        - departureAirportId
        - arrivalAirportId
        - aircraftId
        - departureTime
        - arrivalTime
        - basePrice
        - currency
        - status
        - availableSeats
        - createdAt
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
        flightNumber:
          type: string
          maxLength: 10
          example: FB973
        departureAirportId:
          type: integer
          format: int32
          minimum: 1
        arrivalAirportId:
          type: integer
          format: int32
          minimum: 1
        aircraftId:
          type: integer
          format: int32
          minimum: 1
        departureTime:
          type: string
          format: date-time
        arrivalTime:
          type: string
          format: date-time
        basePrice:
          type: number
          format: double
          minimum: 0.01
          multipleOf: 0.01
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: EUR
        status:
          $ref: '#/components/schemas/FlightStatus'
        availableSeats:
          type: integer
          format: int32
          minimum: 0
          description: Изчислява се като seatCapacity на самолета минус активните билети за полета.
        createdAt:
          type: string
          format: date-time

    FlightCreateRequest:
      type: object
      required:
        - flightNumber
        - departureAirportId
        - arrivalAirportId
        - aircraftId
        - departureTime
        - arrivalTime
        - basePrice
        - currency
        - status
      properties:
        flightNumber:
          type: string
          minLength: 2
          maxLength: 10
        departureAirportId:
          type: integer
          format: int32
          minimum: 1
        arrivalAirportId:
          type: integer
          format: int32
          minimum: 1
          description: Трябва да бъде различно от departureAirportId.
        aircraftId:
          type: integer
          format: int32
          minimum: 1
        departureTime:
          type: string
          format: date-time
        arrivalTime:
          type: string
          format: date-time
          description: Трябва да бъде след departureTime.
        basePrice:
          type: number
          format: double
          minimum: 0.01
          multipleOf: 0.01
        currency:
          type: string
          minLength: 3
          maxLength: 3
        status:
          $ref: '#/components/schemas/FlightStatus'

    FlightUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/FlightCreateRequest'

    Reservation:
      type: object
      description: Отговор за резервация. passengerCount и totalPrice се изчисляват от свързаните билети.
      required:
