openapi: 3.0.3
info:
  title: API за система за резервация на самолетни билети
  version: 1.0.0
  description: |
    Подробна OpenAPI/Swagger документация за курсова работа на тема
    "Airline Ticket Reservation System".

    Системата позволява на потребители да разглеждат налични полети, да търсят
    полети по различни критерии, да създават резервации с един или повече билети
    и да извършват плащания. Администраторите могат да управляват потребители,
    летища, самолети, полети, резервации, билети и плащания.

    Основни технически решения:
    - API-то използва REST архитектура.
    - Защитените услуги използват JWT Bearer authentication.
    - Всички услуги, които връщат списък, поддържат филтриране, странициране и сортиране.
    - Ограниченията за данните са описани чрез required, minLength, maxLength, minimum, maximum и enum.
    - При неуспешни заявки API-то връща подходящ HTTP статус код и описание на причината за грешката.
    - Операциите с база данни, файлове и външни ресурси трябва да се имплементират асинхронно.
    - Полето availableSeats се изчислява и не се съхранява в таблицата Flights.
    - Полето totalPrice на Reservation се изчислява като сума от цените на активните билети.

    Автор: Михаил Веселинов Жеков | фак. номер - 2401321043
    
servers:
  - url: https://localhost:5001/api
    description: Локален development сървър

tags:
  - name: Auth
    description: Регистрация, вход и информация за текущия потребител.
  - name: Users
    description: Управление на потребителски акаунти.
  - name: Airports
    description: Управление на летища.
  - name: Aircraft
    description: Управление на самолети.
  - name: Flights
    description: Управление и търсене на полети.
  - name: Reservations
    description: Управление на резервации с един или повече билети.
  - name: Tickets
    description: Управление на пътнически билети.
  - name: Payments
    description: Управление на плащания към резервации.

security:
  - BearerAuth: []

paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: Регистрация на потребител
      description: Създава клиентски акаунт и връща JWT token. Администраторските акаунти се създават през Users API.
      operationId: registerCustomer
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Потребителят е създаден успешно.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/login:
    post:
      tags:
        - Auth
      summary: Вход в системата
      description: Удостоверява потребител чрез email и парола и връща JWT token.
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешен вход.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/me:
    get:
      tags:
        - Auth
      summary: Данни за текущия потребител
      description: Връща профила на автентикирания потребител.
      operationId: getCurrentUser
      responses:
        '200':
          description: Профил на текущия потребител.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users:
    get:
      tags:
        - Users
      summary: Списък с потребители
      description: Връща потребители с филтриране по име, фамилия, email, роля и активен статус.
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortDirection'
        - name: firstName
          in: query
          description: Филтър по собствено име.
          schema:
            type: string
            maxLength: 50
        - name: lastName
          in: query
          description: Филтър по фамилия.
          schema:
            type: string
            maxLength: 50
        - name: email
          in: query
          description: Филтър по email.
          schema:
            type: string
            maxLength: 100
        - name: role
          in: query
          description: Филтър по потребителска роля.
          schema:
            $ref: '#/components/schemas/UserRole'
        - name: isActive
          in: query
          description: Филтър по активен статус.
          schema:
            type: boolean
      responses:
        '200':
          description: Странициран списък с потребители.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Users
      summary: Създаване на потребител
      description: Създава потребителски акаунт. Услугата е предназначена основно за администратори.
      operationId: createUser
      requestBody:
        $ref: '#/components/requestBodies/UserCreate'
      responses:
        '201':
          description: Потребителят е създаден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/{id}:
    get:
      tags:
        - Users
      summary: Детайли за потребител
      description: Връща потребител по първичен ключ.
      operationId: getUserById
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Намерен потребител.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Users
      summary: Редакция на потребител
      description: Редактира потребителски акаунт. Email адресът трябва да остане уникален.
      operationId: updateUser
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        $ref: '#/components/requestBodies/UserUpdate'
      responses:
        '200':
          description: Потребителят е редактиран.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Users
      summary: Изтриване на потребител
      description: Изтрива или деактивира потребител. При реализация може да се използва soft delete чрез isActive.
      operationId: deleteUser
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Потребителят е изтрит или деактивиран.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /airports:
    get:
      tags:
        - Airports
      summary: Списък с летища
      description: Връща летища с филтриране по IATA код, град, държава и активен статус.
      operationId: listAirports
      parameters:
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortDirection'
        - name: code
          in: query
          description: Филтър по IATA код.
          schema:
            type: string
            minLength: 3
            maxLength: 3
        - name: city
          in: query
          description: Филтър по град.
          schema:
            type: string
            maxLength: 80
        - name: country
          in: query
          description: Филтър по държава.
          schema:
            type: string
            maxLength: 80
        - name: isActive
          in: query
          description: Филтър по активен статус.
          schema:
            type: boolean
      responses:
        '200':
          description: Странициран списък с летища.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAirports'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Airports
      summary: Създаване на летище
      description: Създава летище. IATA кодът трябва да бъде уникален и точно 3 символа.
      operationId: createAirport
      requestBody:
        $ref: '#/components/requestBodies/AirportCreate'
      responses:
        '201':
          description: Летището е създадено.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Airport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /airports/{id}:
    get:
      tags:
        - Airports
      summary: Детайли за летище
      operationId: getAirportById
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Намерено летище.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Airport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Airports
      summary: Редакция на летище
      operationId: updateAirport
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        $ref: '#/components/requestBodies/AirportUpdate'
      responses:
        '200':
          description: Летището е редактирано.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Airport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Airports
      summary: Изтриване на летище
      description: Изтрива или деактивира летище. Летище, което е свързано с полети, не трябва да се изтрива физически.
      operationId: deleteAirport
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Летището е изтрито или деактивирано.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /aircraft:
    get:
      tags:
        - Aircraft
      summary: Списък със самолети
      description: Връща самолети с филтриране по регистрационен номер, модел, производител и активен статус.
      operationId: listAircraft
      parameters:
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortDirection'
        - name: registrationNumber
          in: query
          description: Филтър по регистрационен номер.
          schema:
            type: string
            maxLength: 20
        - name: model
          in: query
          description: Филтър по модел.
          schema:
            type: string
            maxLength: 80
        - name: manufacturer
          in: query
          description: Филтър по производител.
          schema:
            type: string
            maxLength: 80
        - name: isActive
          in: query
          description: Филтър по активен статус.
          schema:
            type: boolean
      responses:
        '200':
          description: Странициран списък със самолети.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAircraft'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Aircraft
      summary: Създаване на самолет
      description: Създава самолет. Регистрационният номер трябва да бъде уникален.
      operationId: createAircraft
      requestBody:
        $ref: '#/components/requestBodies/AircraftCreate'
      responses:
        '201':
          description: Самолетът е създаден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Aircraft'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /aircraft/{id}:
    get:
      tags:
        - Aircraft
      summary: Детайли за самолет
      operationId: getAircraftById
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Намерен самолет.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Aircraft'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Aircraft
      summary: Редакция на самолет
      operationId: updateAircraft
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        $ref: '#/components/requestBodies/AircraftUpdate'
      responses:
        '200':
          description: Самолетът е редактиран.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Aircraft'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Aircraft
      summary: Изтриване на самолет
      description: Изтрива или деактивира самолет. Самолет, който е свързан с полети, не трябва да се изтрива физически.
      operationId: deleteAircraft
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Самолетът е изтрит или деактивиран.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /flights:
    get:
      tags:
        - Flights
      summary: Списък и търсене на полети
      description: |
        Връща полети с филтриране по номер на полет, начално летище,
        крайно летище, дата на излитане, статус и ценови диапазон.
        Полето availableSeats се изчислява като капацитет на самолета минус
        активните билети за съответния полет.
      operationId: listFlights
      parameters:
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortDirection'
        - name: flightNumber
          in: query
          description: Филтър по номер на полет.
          schema:
            type: string
            maxLength: 10
        - name: departureAirportId
          in: query
          description: Филтър по начално летище.
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: arrivalAirportId
          in: query
          description: Филтър по крайно летище.
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: departureDate
          in: query
          description: Филтър по дата на излитане.
          schema:
            type: string
            format: date
        - name: status
          in: query
          description: Филтър по статус на полет.
          schema:
            $ref: '#/components/schemas/FlightStatus'
        - name: minPrice
          in: query
          description: Минимална базова цена.
          schema:
            type: number
            format: double
            minimum: 0
        - name: maxPrice
          in: query
          description: Максимална базова цена.
          schema:
            type: number
            format: double
            minimum: 0
      responses:
        '200':
          description: Странициран списък с полети.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFlights'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Flights
      summary: Създаване на полет
      description: |
        Създава планиран полет. Началното и крайното летище трябва да са различни,
        часът на пристигане трябва да е след часа на излитане, а базовата цена
        трябва да е по-голяма от 0.
      operationId: createFlight
      requestBody:
        $ref: '#/components/requestBodies/FlightCreate'
      responses:
        '201':
          description: Полетът е създаден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flight'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /flights/{id}:
    get:
      tags:
        - Flights
      summary: Детайли за полет
      operationId: getFlightById
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Намерен полет.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flight'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Flights
      summary: Редакция на полет
      operationId: updateFlight
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        $ref: '#/components/requestBodies/FlightUpdate'
      responses:
        '200':
          description: Полетът е редактиран.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flight'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Flights
      summary: Изтриване на полет
      description: Изтрива или отменя полет. Полет с потвърдени резервации трябва да бъде отменен, а не физически изтрит.
      operationId: deleteFlight
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Полетът е изтрит или отменен.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /reservations:
    get:
      tags:
        - Reservations
      summary: Списък с резервации
      description: Връща резервации с филтриране по потребител, полет, код на резервация, статус и период на създаване.
      operationId: listReservations
      parameters:
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortDirection'
        - name: userId
          in: query
          description: Филтър по потребител.
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: flightId
          in: query
          description: Филтър по полет.
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: reservationCode
          in: query
          description: Филтър по код на резервация.
          schema:
            type: string
            maxLength: 12
        - name: status
          in: query
          description: Филтър по статус на резервация.
          schema:
            $ref: '#/components/schemas/ReservationStatus'
        - name: bookingDateFrom
          in: query
          description: Начална дата за търсене.
          schema:
            type: string
            format: date
        - name: bookingDateTo
          in: query
          description: Крайна дата за търсене.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Странициран списък с резервации.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReservations'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Reservations
      summary: Създаване на резервация с билети
      description: |
        Създава една резервация за избран полет с един или повече пътнически билети.
        Сървърът изчислява броя пътници и общата цена. Избраният полет трябва да има
        достатъчно изчислени свободни места.
      operationId: createReservation
      requestBody:
        $ref: '#/components/requestBodies/ReservationCreate'
      responses:
        '201':
          description: Резервацията е създадена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /reservations/{id}:
    get:
      tags:
        - Reservations
      summary: Детайли за резервация
      operationId: getReservationById
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Намерена резервация.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Reservations
      summary: Редакция на резервация
      description: Редактира статус или срок на резервация. Промените по билетите се обработват през Tickets API.
      operationId: updateReservation
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        $ref: '#/components/requestBodies/ReservationUpdate'
      responses:
        '200':
          description: Резервацията е редактирана.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Reservations
      summary: Изтриване на резервация
      description: Отменя или изтрива резервация и освобождава активните й билети от изчислението за свободни места.
      operationId: deleteReservation
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Резервацията е изтрита или отменена.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /tickets:
    get:
      tags:
        - Tickets
      summary: Списък с билети
      description: Връща билети с филтриране по резервация, фамилия на пътник, документ, клас и статус.
      operationId: listTickets
      parameters:
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortDirection'
        - name: reservationId
          in: query
          description: Филтър по резервация.
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: passengerLastName
          in: query
          description: Филтър по фамилия на пътник.
          schema:
            type: string
            maxLength: 50
        - name: passengerDocumentNumber
          in: query
          description: Филтър по номер на документ.
          schema:
            type: string
            maxLength: 30
        - name: fareClass
          in: query
          description: Филтър по клас.
          schema:
            $ref: '#/components/schemas/FareClass'
        - name: ticketStatus
          in: query
          description: Филтър по статус на билет.
          schema:
            $ref: '#/components/schemas/TicketStatus'
      responses:
        '200':
          description: Странициран списък с билети.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTickets'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Tickets
      summary: Създаване на билет
      description: Създава билет към съществуваща резервация. Номерът на място трябва да бъде уникален за активните билети на същия полет.
      operationId: createTicket
      requestBody:
        $ref: '#/components/requestBodies/TicketCreate'
      responses:
        '201':
          description: Билетът е създаден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /tickets/{id}:
    get:
      tags:
        - Tickets
      summary: Детайли за билет
      operationId: getTicketById
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Намерен билет.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Tickets
      summary: Редакция на билет
      operationId: updateTicket
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        $ref: '#/components/requestBodies/TicketUpdate'
      responses:
        '200':
          description: Билетът е редактиран.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Tickets
      summary: Изтриване на билет
      description: Отменя или изтрива билет и при реализация актуализира общата цена на резервацията.
      operationId: deleteTicket
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Билетът е изтрит или отменен.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /payments:
    get:
      tags:
        - Payments
      summary: Списък с плащания
      description: Връща плащания с филтриране по резервация, статус, метод на плащане и transaction reference.
      operationId: listPayments
      parameters:
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortDirection'
        - name: reservationId
          in: query
          description: Филтър по резервация.
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: paymentStatus
          in: query
          description: Филтър по статус на плащане.
          schema:
            $ref: '#/components/schemas/PaymentStatus'
        - name: paymentMethod
          in: query
          description: Филтър по метод на плащане.
          schema:
            $ref: '#/components/schemas/PaymentMethod'
        - name: transactionReference
          in: query
          description: Филтър по референтен номер на транзакция.
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Странициран списък с плащания.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPayments'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Payments
      summary: Създаване на плащане
      description: Създава опит за плащане към резервация. Позволени са няколко плащания към една резервация при неуспешен или повторен опит.
      operationId: createPayment
      requestBody:
        $ref: '#/components/requestBodies/PaymentCreate'
      responses:
        '201':
          description: Плащането е създадено.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /payments/{id}:
    get:
      tags:
        - Payments
      summary: Детайли за плащане
      operationId: getPaymentById
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Намерено плащане.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Payments
      summary: Редакция на плащане
      operationId: updatePayment
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        $ref: '#/components/requestBodies/PaymentUpdate'
      responses:
        '200':
          description: Плащането е редактирано.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Payments
      summary: Изтриване на плащане
      description: Изтрива запис за плащане. Завършените плащания обикновено трябва да се възстановяват, а не да се изтриват физически.
      operationId: deletePayment
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Плащането е изтрито.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Положителен integer първичен ключ.
      schema:
        type: integer
        format: int32
        minimum: 1
    PageNumber:
      name: pageNumber
      in: query
      description: Номер на страница, започващ от 1.
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Брой записи на страница.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 10
    SortBy:
      name: sortBy
      in: query
      description: Име на поле за сортиране.
      schema:
        type: string
        maxLength: 50
        default: id
    SortDirection:
      name: sortDirection
      in: query
      description: Посока на сортиране.
      schema:
        type: string
        enum:
          - asc
          - desc
        default: asc

  requestBodies:
    UserCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserCreateRequest'
    UserUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserUpdateRequest'
    AirportCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AirportCreateRequest'
    AirportUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AirportUpdateRequest'
    AircraftCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AircraftCreateRequest'
    AircraftUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AircraftUpdateRequest'
    FlightCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FlightCreateRequest'
    FlightUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FlightUpdateRequest'
    ReservationCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReservationCreateRequest'
    ReservationUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReservationUpdateRequest'
    TicketCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TicketCreateRequest'
    TicketUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TicketUpdateRequest'
    PaymentCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaymentCreateRequest'
    PaymentUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaymentUpdateRequest'

  responses:
    BadRequest:
      description: Невалидна заявка или грешка при валидация.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Липсващ, изтекъл или невалиден JWT token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Автентикираният потребител няма права за тази операция.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Търсеният ресурс не е намерен.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: Заявката противоречи на текущото състояние или на уникално ограничение.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    InternalServerError:
      description: Неочаквана сървърна грешка, обработена от глобален exception handler.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    ProblemDetails:
      type: object
      description: Отговор при грешка с информация за възникналия проблем.
      required:
        - type
        - title
        - status
        - traceId
      properties:
        type:
          type: string
          maxLength: 200
          example: https://httpstatuses.com/400
        title:
          type: string
          maxLength: 120
          example: Validation failed
        status:
          type: integer
          format: int32
          example: 400
        detail:
          type: string
          maxLength: 500
          nullable: true
          example: One or more validation errors occurred.
        instance:
          type: string
          maxLength: 200
          nullable: true
          example: /api/flights
        traceId:
          type: string
          maxLength: 100
          example: 00-4bf92f3577b34da6a3ce929d0e0e4736
        errors:
          type: object
          nullable: true
          additionalProperties:
            type: array
            items:
              type: string

    UserRole:
      type: string
      maxLength: 20
      enum:
        - Customer
        - Admin

    FlightStatus:
      type: string
      maxLength: 30
      enum:
        - Scheduled
        - Boarding
        - Departed
        - Arrived
        - Delayed
        - Cancelled

    ReservationStatus:
      type: string
      maxLength: 30
      enum:
        - Pending
        - Confirmed
        - Cancelled
        - Expired

    TicketStatus:
      type: string
      maxLength: 30
      enum:
        - Issued
        - CheckedIn
        - Cancelled
        - Refunded

    PaymentStatus:
      type: string
      maxLength: 30
      enum:
        - Pending
        - Completed
        - Failed
        - Refunded

    PaymentMethod:
      type: string
      maxLength: 30
      enum:
        - Card
        - BankTransfer
        - Cash

    FareClass:
      type: string
      maxLength: 20
      enum:
        - Economy
        - PremiumEconomy
        - Business
        - First

    PassengerType:
      type: string
      maxLength: 20
      enum:
        - Adult
        - Child
        - Student
        - Infant

    PaginationMetadata:
      type: object
      required:
        - pageNumber
        - pageSize
        - totalItems
        - totalPages
      properties:
        pageNumber:
          type: integer
          format: int32
          minimum: 1
        pageSize:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        totalItems:
          type: integer
          format: int32
          minimum: 0
        totalPages:
          type: integer
          format: int32
          minimum: 0

    RegisterRequest:
      type: object
      required:
        - firstName
        - lastName
        - email
        - password
      properties:
        firstName:
          type: string
          minLength: 2
          maxLength: 50
          example: Ivan
        lastName:
          type: string
          minLength: 2
          maxLength: 50
          example: Ivanov
        email:
          type: string
          format: email
          maxLength: 100
          example: ivan@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 100
          example: SecurePass123!
        phoneNumber:
          type: string
          maxLength: 20
          nullable: true
          example: '+359888123456'

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 100
          example: ivan@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 100
          example: SecurePass123!

    AuthResponse:
      type: object
      required:
        - token
        - expiresAt
        - user
      properties:
        token:
          type: string
          maxLength: 2000
          description: JWT Bearer token.
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      description: Потребителски акаунт. В базата се пази passwordHash, но той никога не се връща от API-то.
      required:
        - id
        - firstName
        - lastName
        - email
        - role
        - createdAt
        - isActive
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
        firstName:
          type: string
          maxLength: 50
        lastName:
          type: string
          maxLength: 50
        email:
          type: string
          format: email
          maxLength: 100
        role:
          $ref: '#/components/schemas/UserRole'
        phoneNumber:
          type: string
          maxLength: 20
          nullable: true
        createdAt:
          type: string
          format: date-time
        isActive:
          type: boolean

    UserCreateRequest:
      type: object
      required:
        - firstName
        - lastName
        - email
        - password
        - role
        - isActive
      properties:
        firstName:
          type: string
          minLength: 2
          maxLength: 50
        lastName:
          type: string
          minLength: 2
          maxLength: 50
        email:
          type: string
          format: email
          maxLength: 100
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 100
        role:
          $ref: '#/components/schemas/UserRole'
        phoneNumber:
          type: string
          maxLength: 20
          nullable: true
        isActive:
          type: boolean

    UserUpdateRequest:
      type: object
      required:
        - firstName
        - lastName
        - email
        - role
        - isActive
      properties:
        firstName:
          type: string
          minLength: 2
          maxLength: 50
        lastName:
          type: string
          minLength: 2
          maxLength: 50
        email:
          type: string
          format: email
          maxLength: 100
        role:
          $ref: '#/components/schemas/UserRole'
        phoneNumber:
          type: string
          maxLength: 20
          nullable: true
        isActive:
          type: boolean

    Airport:
      type: object
      required:
        - id
        - code
