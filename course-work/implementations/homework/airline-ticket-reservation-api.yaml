        - flightId
        - reservationCode
        - bookingDate
        - totalPrice
        - currency
        - status
        - passengerCount
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
        userId:
          type: integer
          format: int32
          minimum: 1
        flightId:
          type: integer
          format: int32
          minimum: 1
        reservationCode:
          type: string
          maxLength: 12
          example: RZ8K2QX9
        bookingDate:
          type: string
          format: date-time
        totalPrice:
          type: number
          format: double
          minimum: 0
          multipleOf: 0.01
          description: Изчислява се като сума от цените на активните билети.
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: EUR
        status:
